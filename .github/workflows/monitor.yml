name: Monitor de saúde

on:
  schedule:
    - cron: "0 11 * * 1-5"   # dias úteis, 8h no horário de Brasília
  workflow_dispatch:
    inputs:
      demo_failure:
        description: "Incluir uma checagem que falha de propósito (demonstração do alerta vermelho)"
        type: boolean
        default: false

jobs:
  monitor:
    name: Checagens + relatórios
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo   # horários do relatório no fuso de Brasília
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: bundle install
      - name: Rodar monitor
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DEMO_FAILURE: ${{ inputs.demo_failure }}
        run: bundle exec ruby bin/monitor
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: planilha-${{ github.run_number }}
          path: reports/
